name: Deploy to RRP

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      
    - name: Deploy to Edgio
      uses: ronaldrpruitt/deploy-action@v1.0.6
      with:
        edgio-deploy-token: ${{ secrets.EDGIO_DEPLOY_TOKEN }}
